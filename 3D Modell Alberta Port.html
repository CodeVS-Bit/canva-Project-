<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Karte – Port Alberta</title>
  <style>
    :root {
      --bg1: #dfe9e7;
      --bg2: #bfd0cb;
      --panel: rgba(244, 247, 245, 0.75);
      --line: rgba(29, 43, 39, 0.18);
      --text: #1a2a29;
      --muted: #586b68;
      --accent: #d76f4f;
      --accent2: #497a76;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, var(--bg1), var(--bg2));
      color: var(--text);
    }

    #scene {
      width: 100vw;
      height: 100vh;
      display: block;
    }

    .hud {
      position: fixed;
      top: 20px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      z-index: 10;
    }

    .title-box,
    .info-box {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 10px 28px rgba(25, 42, 38, 0.08);
    }

    .title-box {
      padding: 18px 22px;
      max-width: 420px;
    }

    .eyebrow {
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700;
    }

    h1 {
      margin: 10px 0 6px;
      font-size: clamp(28px, 3vw, 46px);
      line-height: 1;
      letter-spacing: -0.06em;
    }

    .subtitle {
      margin: 0;
      font-size: 13px;
      color: var(--muted);
    }

    .info-box {
      padding: 14px 18px;
      min-width: 240px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .dot {
      width: 8px;
      height: 8px;
      background: #4e9a7d;
      border-radius: 50%;
      box-shadow: 0 0 0 4px rgba(78, 154, 125, 0.14);
    }

    .metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 14px;
    }

    .metric {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .label {
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .value {
      font-size: 15px;
      font-weight: 700;
    }

    .bottom-note {
      position: fixed;
      left: 20px;
      bottom: 20px;
      z-index: 10;
      display: flex;
      gap: 12px;
      pointer-events: none;
    }

    .chip {
      background: rgba(255, 255, 255, 0.52);
      border: 1px solid rgba(25, 42, 38, 0.12);
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    @media (max-width: 760px) {
      .hud {
        flex-direction: column;
        gap: 12px;
      }

      .info-box {
        min-width: 0;
        width: fit-content;
      }
    }
  </style>
</head>

<body>
  <canvas id="scene"></canvas>

  <div class="hud">
    <div class="title-box">
      <div class="eyebrow">Alberta · Inland Port</div>
      <h1>Port Alberta</h1>
      <p class="subtitle">3D-Karte eines intermodalen Logistik- und Umschlaggebiets</p>
    </div>

    <div class="info-box">
      <div class="status"><span class="dot"></span> 3D-Visualisierung</div>
      <div class="metrics">
        <div class="metric">
          <span class="label">Funktion</span>
          <span class="value">Container</span>
        </div>
        <div class="metric">
          <span class="label">Verkehr</span>
          <span class="value">Schiene + Straße</span>
        </div>
        <div class="metric">
          <span class="label">Region</span>
          <span class="value">Alberta</span>
        </div>
        <div class="metric">
          <span class="label">Modell</span>
          <span class="value">Konzept</span>
        </div>
      </div>
    </div>
  </div>

  <div class="bottom-note">
    <div class="chip">Drag + drehen</div>
    <div class="chip">Scroll + zoomen</div>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';

    const canvas = document.getElementById('scene');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#dfe9e7');
    scene.fog = new THREE.Fog('#dfe9e7', 30, 90);

    const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(24, 19, 28);

    const controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.target.set(0, 1, 0);
    controls.minDistance = 16;
    controls.maxDistance = 60;
    controls.maxPolarAngle = Math.PI * 0.48;

    const ambient = new THREE.HemisphereLight('#edf8f3', '#81928a', 1.7);
    scene.add(ambient);

    const sun = new THREE.DirectionalLight('#fff2d7', 2.3);
    sun.position.set(14, 24, 10);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -40;
    sun.shadow.camera.right = 40;
    sun.shadow.camera.top = 40;
    sun.shadow.camera.bottom = -40;
    scene.add(sun);

    const groundMat = new THREE.MeshStandardMaterial({ color: '#a3b7a0', roughness: 0.95, metalness: 0.03 });
    const soilMat = new THREE.MeshStandardMaterial({ color: '#b6af8d', roughness: 1 });
    const concreteMat = new THREE.MeshStandardMaterial({ color: '#c8cbc4', roughness: 0.88 });
    const asphaltMat = new THREE.MeshStandardMaterial({ color: '#5c6461', roughness: 0.8 });
    const metalMat = new THREE.MeshStandardMaterial({ color: '#536862', roughness: 0.5, metalness: 0.35 });
    const lineMat = new THREE.MeshStandardMaterial({ color: '#f1e0a5', roughness: 0.7 });
    const waterMat = new THREE.MeshStandardMaterial({ color: '#7ab1c8', roughness: 0.26, metalness: 0.1, transparent: true, opacity: 0.9 });
    const whiteMat = new THREE.MeshStandardMaterial({ color: '#edf1ee', roughness: 0.75 });
    const redMat = new THREE.MeshStandardMaterial({ color: '#d06d51', roughness: 0.72 });
    const cyanMat = new THREE.MeshStandardMaterial({ color: '#5e9aa9', roughness: 0.62 });
    const blueMat = new THREE.MeshStandardMaterial({ color: '#2a5d76', roughness: 0.75 });
    const greenMat = new THREE.MeshStandardMaterial({ color: '#5a8a6e', roughness: 0.7 });
    const yellowMat = new THREE.MeshStandardMaterial({ color: '#d9a653', roughness: 0.8 });
    const darkMat = new THREE.MeshStandardMaterial({ color: '#253a35', roughness: 0.7 });

    function addBox(x, y, z, w, h, d, material, cast = true) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
      mesh.position.set(x, y + h / 2, z);
      mesh.castShadow = cast;
      mesh.receiveShadow = true;
      scene.add(mesh);
      return mesh;
    }

    function addCylinder(x, y, z, r, h, material, segments = 16) {
      const mesh = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, segments), material);
      mesh.position.set(x, y + h / 2, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
      return mesh;
    }

    const base = new THREE.Mesh(new THREE.PlaneGeometry(56, 42), groundMat);
    base.rotation.x = -Math.PI / 2;
    base.receiveShadow = true;
    scene.add(base);

    const river = new THREE.Mesh(new THREE.BoxGeometry(18, 0.8, 10), waterMat);
    river.position.set(-18, 0.2, 14);
    river.rotation.y = 0.2;
    river.receiveShadow = true;
    scene.add(river);

    const portPad = new THREE.Mesh(new THREE.BoxGeometry(30, 0.6, 22), concreteMat);
    portPad.position.set(0, 0.25, -1);
    portPad.receiveShadow = true;
    scene.add(portPad);

    const roadA = new THREE.Mesh(new THREE.BoxGeometry(34, 0.15, 3.4), asphaltMat);
    roadA.position.set(0, 0.18, 15.5);
    roadA.receiveShadow = true;
    scene.add(roadA);

    for (let x = -14; x < 15; x += 3.2) {
      const line = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.05, 0.12), lineMat);
      line.position.set(x, 0.28, 15.5);
      scene.add(line);
    }

    for (let i = 0; i < 3; i++) {
      const trackY = -12.9 + i * 1.7;
      const rail = new THREE.Mesh(new THREE.BoxGeometry(34, 0.08, 0.18), metalMat);
      rail.position.set(0, 0.2, trackY);
      rail.receiveShadow = true;
      scene.add(rail);
      const rail2 = new THREE.Mesh(new THREE.BoxGeometry(34, 0.08, 0.18), metalMat);
      rail2.position.set(0, 0.2, trackY + 1.0);
      rail2.receiveShadow = true;
      scene.add(rail2);

      for (let x = -16; x <= 16; x += 1.8) {
        const sleeper = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.09, 0.9), darkMat);
        sleeper.position.set(x, 0.13, trackY + 0.45);
        scene.add(sleeper);
      }
    }

    addBox(-7, 0, -4.5, 8.8, 3.5, 6.2, whiteMat);
    addBox(7.5, 0, -5.3, 10.4, 3.8, 7.2, new THREE.MeshStandardMaterial({ color: '#dde5e0', roughness: 0.8 }));
    addBox(13.5, 0.1, 3.6, 5.2, 4.7, 4.8, whiteMat);
    addBox(13.5, 4.75, 3.6, 5.6, 0.18, 5.1, darkMat);

    const craneMat = new THREE.MeshStandardMaterial({ color: '#d46854', roughness: 0.65 });
    const armMat = new THREE.MeshStandardMaterial({ color: '#e5edf0', roughness: 0.75 });

    function addCrane(x, z) {
      addBox(x - 7.2, 0, z, 0.4, 8, 0.4, craneMat);
      addBox(x + 7.2, 0, z, 0.4, 8, 0.4, craneMat);
      addBox(x, 7.3, z, 15.4, 0.35, 0.6, craneMat);
      addBox(x, 8.1, z, 2.5, 0.28, 0.5, armMat);
      addBox(x + 5.3, 7.2, z, 0.28, 1.8, 0.28, craneMat);
    }

    addCrane(-2, -9.5);
    addCrane(11.5, -9.5);

    const containerColors = [redMat, blueMat, yellowMat, greenMat, whiteMat, cyanMat];
    for (let row = 0; row < 3; row++) {
      for (let col = 0; col < 7; col++) {
        const x = -13 + col * 2.2;
        const z = 2.8 + row * 2.5;
        const stackHeight = 1 + ((row + col) % 3);
        for (let level = 0; level < stackHeight; level++) {
          const c = addBox(x, level * 1.18, z, 1.8, 1.1, 2, containerColors[(row * 3 + col + level) % containerColors.length]);
          c.position.y = level * 1.18 + 0.55;
        }
      }
    }

    function addTruck(x, z, color) {
      addBox(x, 0.15, z, 2.8, 0.6, 1.2, color);
      addBox(x + 1.2, 0.5, z, 0.9, 0.7, 0.9, whiteMat);
      addCylinder(x - 0.9, 0.05, z - 0.6, 0.22, 0.14, darkMat, 12);
      addCylinder(x + 0.9, 0.05, z - 0.6, 0.22, 0.14, darkMat, 12);
      addCylinder(x - 0.9, 0.05, z + 0.6, 0.22, 0.14, darkMat, 12);
      addCylinder(x + 0.9, 0.05, z + 0.6, 0.22, 0.14, darkMat, 12);
    }

    addTruck(-15.5, 15.5, blueMat);
    addTruck(-8.5, 15.5, redMat);
    addTruck(6.5, 15.5, greenMat);

    const loco = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(4.2, 1.1, 1.5), darkMat);
    body.position.y = 0.8;
    loco.add(body);
    const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.8, 1.3, 1.5), metalMat);
    cabin.position.set(-1.1, 1.35, 0);
    loco.add(cabin);
    for (let x = -1.7; x <= 1.7; x += 1.2) {
      const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.24, 0.18, 18), darkMat);
      wheel.rotation.z = Math.PI / 2;
      wheel.position.set(x, 0.2, 0.75);
      loco.add(wheel);
      const wheel2 = wheel.clone();
      wheel2.position.z = -0.75;
      loco.add(wheel2);
    }
    loco.position.set(-16, 0, -12.2);
    scene.add(loco);

    for (let i = 0; i < 10; i++) {
      const tree = new THREE.Group();
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.12, 1.2, 8), new THREE.MeshStandardMaterial({ color: '#6e5f53', roughness: 0.9 }));
      trunk.position.y = 0.6;
      tree.add(trunk);
      const crown = new THREE.Mesh(new THREE.ConeGeometry(0.9, 1.9, 8), new THREE.MeshStandardMaterial({ color: '#6f9380', roughness: 0.9 }));
      crown.position.y = 2.2;
      tree.add(crown);
      tree.position.set(-21 + i * 4.2, 0, 18.5);
      scene.add(tree);
    }

    const titleLabel = new THREE.Sprite(
      new THREE.SpriteMaterial({
        map: (() => {
          const canvas = document.createElement('canvas');
          canvas.width = 1024;
          canvas.height = 256;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = 'rgba(26,42,41,0.9)';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = '#f4f7f5';
          ctx.font = 'bold 120px Segoe UI';
          ctx.fillText('ALBERTA PORT', 40, 150);
          return new THREE.CanvasTexture(canvas);
        })(),
        transparent: false,
        depthTest: false
      })
    );
    titleLabel.position.set(0, 8.5, -5.5);
    titleLabel.scale.set(11, 2.8, 1);
    scene.add(titleLabel);

    function onResize() {
      renderer.setSize(window.innerWidth, window.innerHeight);
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', onResize);

    function animate() {
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>

</html>
