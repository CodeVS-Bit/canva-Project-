<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Port Alberta – Logistikkorridor Edmonton</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
      :root {
        --ink: #243b35;
        --muted: #64756e;
        --paper: rgba(250, 251, 246, 0.95);
        --line: rgba(36, 59, 53, 0.15);
        --orange: #ef792f;
        --violet: #9853d1;
        --blue: #2488a5;
      }

      * { box-sizing: border-box; }

      html, body, #map {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
        color: var(--ink);
        font-family: "Aptos", "Segoe UI", sans-serif;
        background: #dce9df;
      }

      #map { position: absolute; inset: 0; }

      .masthead,
      .legend,
      .places {
        position: absolute;
        z-index: 500;
        background: var(--paper);
        border: 1px solid var(--line);
        box-shadow: 0 12px 34px rgba(28, 49, 42, 0.13);
        backdrop-filter: blur(12px);
      }

      .masthead {
        top: 22px;
        left: 22px;
        padding: 15px 19px 16px;
        border-radius: 4px;
        border-top: 3px solid var(--orange);
        min-width: 270px;
      }

      .kicker {
        margin: 0 0 7px;
        color: var(--muted);
        font-size: 10px;
        font-weight: 750;
        letter-spacing: 1px;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 29px;
        font-weight: 600;
        line-height: 1.05;
      }

      .subtitle {
        margin: 7px 0 0;
        color: var(--muted);
        font-size: 12px;
      }

      .legend {
        top: 22px;
        right: 22px;
        width: 232px;
        padding: 15px 16px 13px;
        border-radius: 4px;
      }

      .panel-title {
        margin: 0 0 12px;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.8px;
        text-transform: uppercase;
      }

      .legend-list {
        display: grid;
        gap: 10px;
      }

      .legend-row {
        display: flex;
        align-items: center;
        gap: 10px;
        color: #41534d;
        font-size: 12px;
      }

      .swatch {
        flex: 0 0 13px;
        width: 13px;
        height: 13px;
        border: 2px solid #fff;
        border-radius: 50%;
        box-shadow: 0 0 0 1px rgba(36, 59, 53, 0.3);
      }

      .swatch.logistics { background: var(--violet); }
      .swatch.rail { background: var(--orange); }
      .swatch.airport { background: var(--blue); }
      .route-swatch {
        flex: 0 0 17px;
        width: 17px;
        border-top: 3px dashed var(--orange);
      }

      .places {
        bottom: 25px;
        left: 22px;
        width: min(390px, calc(100vw - 44px));
        padding: 15px 16px 8px;
        border-radius: 4px;
      }

      .place-list { display: grid; }

      .place-button {
        display: grid;
        grid-template-columns: 12px minmax(0, 1fr) 18px;
        align-items: start;
        gap: 10px;
        width: 100%;
        padding: 10px 0;
        border: 0;
        border-top: 1px solid var(--line);
        background: transparent;
        color: inherit;
        text-align: left;
        cursor: pointer;
      }

      .place-button:hover .place-name { color: #b95e26; }
      .place-button:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }

      .place-dot {
        width: 10px;
        height: 10px;
        margin-top: 3px;
        border-radius: 50%;
      }

      .place-name {
        display: block;
        font-size: 12px;
        font-weight: 750;
        line-height: 1.25;
      }

      .place-description {
        display: block;
        margin-top: 3px;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.35;
      }

      .place-arrow {
        color: #829088;
        font-size: 16px;
        line-height: 1;
      }

      .map-label {
        padding: 3px 7px;
        border: 1px solid rgba(36, 59, 53, 0.12);
        border-radius: 3px;
        background: rgba(250, 251, 246, 0.94);
        box-shadow: 0 2px 8px rgba(28, 49, 42, 0.12);
        color: var(--ink);
        font-family: "Aptos", "Segoe UI", sans-serif;
        font-size: 11px;
        font-weight: 700;
      }

      .map-label::before { display: none; }
      .leaflet-control-attribution { font-size: 10px !important; }
      .leaflet-popup-content-wrapper { border-radius: 4px; }
      .popup-title { margin-bottom: 4px; font-weight: 750; }
      .popup-copy { color: var(--muted); font-size: 12px; line-height: 1.4; }

      @media (max-width: 700px) {
        .masthead { top: 12px; left: 12px; min-width: 0; padding: 12px 14px; }
        h1 { font-size: 24px; }
        .subtitle { max-width: 190px; font-size: 11px; }
        .legend { top: 12px; right: 12px; width: 174px; padding: 12px; }
        .panel-title { margin-bottom: 9px; }
        .legend-list { gap: 8px; }
        .legend-row { gap: 8px; font-size: 10px; }
        .places { bottom: 12px; left: 12px; width: calc(100vw - 24px); padding: 11px 13px 5px; }
        .places .panel-title { margin-bottom: 7px; }
        .place-button { grid-template-columns: 10px minmax(0, 1fr) 14px; gap: 8px; padding: 7px 0; }
        .place-name { font-size: 11px; }
        .place-description { margin-top: 2px; font-size: 10px; }
      }

      @media (max-width: 390px) {
        .masthead { max-width: 46vw; }
        .legend { width: 48vw; }
        .kicker { font-size: 9px; }
        h1 { font-size: 21px; }
      }
    </style>
  </head>
  <body>
    <main id="map" aria-label="Interaktive Karte der Logistikstandorte im Raum Edmonton"></main>

    <header class="masthead">
      <p class="kicker">Alberta · Intermodales Logistiknetz</p>
      <h1>Port Alberta</h1>
      <p class="subtitle">Standorte und Verkehrskorridore im Raum Edmonton</p>
    </header>

    <aside class="legend" aria-label="Kartenlegende">
      <h2 class="panel-title">Legende</h2>
      <div class="legend-list">
        <div class="legend-row"><span class="swatch logistics"></span><span>Industrie und Logistik</span></div>
        <div class="legend-row"><span class="swatch rail"></span><span>Schienengüterverkehr</span></div>
        <div class="legend-row"><span class="swatch airport"></span><span>Flughafen</span></div>
        <div class="legend-row"><span class="route-swatch"></span><span>Hwy 2 · CANAMEX-Korridor</span></div>
      </div>
    </aside>

    <section class="places" aria-label="Standorte">
      <h2 class="panel-title">Logistikstandorte</h2>
      <div class="place-list">
        <button class="place-button" type="button" data-place="acheson">
          <span class="place-dot" style="background: var(--violet)"></span>
          <span><span class="place-name">Acheson</span><span class="place-description">Bedeutender Industrie- und Logistikpark im Westen</span></span>
          <span class="place-arrow" aria-hidden="true">›</span>
        </button>
        <button class="place-button" type="button" data-place="rail">
          <span class="place-dot" style="background: var(--orange)"></span>
          <span><span class="place-name">CPKC Railway · Edmonton Intermodal</span><span class="place-description">Zentraler Bahngüter- und Umschlagbahnhof</span></span>
          <span class="place-arrow" aria-hidden="true">›</span>
        </button>
        <button class="place-button" type="button" data-place="highway">
          <span class="place-dot" style="background: var(--orange)"></span>
          <span><span class="place-name">Hwy 2 · CANAMEX</span><span class="place-description">Wichtiger Handels- und Transitkorridor</span></span>
          <span class="place-arrow" aria-hidden="true">›</span>
        </button>
        <button class="place-button" type="button" data-place="airport">
          <span class="place-dot" style="background: var(--blue)"></span>
          <span><span class="place-name">Edmonton International Airport</span><span class="place-description">Flughafen südlich des Ballungsraums Edmonton</span></span>
          <span class="place-arrow" aria-hidden="true">›</span>
        </button>
      </div>
    </section>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
      const map = L.map('map', { zoomControl: false, scrollWheelZoom: true });

      const ReferrerPolicyTileLayer = L.TileLayer.extend({
        createTile(coords, done) {
          const tile = document.createElement('img');
          L.DomEvent.on(tile, 'load', L.bind(this._tileOnLoad, this, done, tile));
          L.DomEvent.on(tile, 'error', L.bind(this._tileOnError, this, done, tile));
          if (this.options.crossOrigin || this.options.crossOrigin === '') {
            tile.crossOrigin = this.options.crossOrigin === true ? '' : this.options.crossOrigin;
          }
          tile.referrerPolicy = this.options.referrerPolicy;
          tile.alt = '';
          tile.setAttribute('role', 'presentation');
          tile.src = this.getTileUrl(coords);
          return tile;
        }
      });

      new ReferrerPolicyTileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 18,
        referrerPolicy: 'strict-origin-when-cross-origin',
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>-Mitwirkende'
      }).addTo(map);
      L.control.zoom({ position: 'bottomright' }).addTo(map);

      const locations = {
        acheson: {
          point: [53.548, -113.95],
          color: '#9853d1',
          title: 'Acheson',
          description: 'Bedeutender Industrie- und Logistikpark westlich von Edmonton.',
          label: 'Acheson'
        },
        rail: {
          point: [53.575, -113.405],
          color: '#ef792f',
          title: 'CPKC Railway · Edmonton Intermodal',
          description: 'Zentraler Bahngüter- und Umschlagbahnhof in Edmonton.',
          label: 'CPKC Intermodal'
        },
        highway: {
          point: [53.405, -113.525],
          color: '#ef792f',
          title: 'Hwy 2 · CANAMEX',
          description: 'Wichtiger Handels- und Transitkorridor in Alberta.',
          label: 'Hwy 2'
        },
        airport: {
          point: [53.309, -113.579],
          color: '#2488a5',
          title: 'Edmonton International Airport',
          description: 'Internationaler Flughafen südlich von Edmonton.',
          label: 'Edmonton Airport'
        }
      };

      const markers = {};
      Object.entries(locations).forEach(([key, place]) => {
        const icon = L.divIcon({
          className: '',
          html: `<span style="display:block;width:22px;height:22px;border:4px solid #fff;border-radius:50%;background:${place.color};box-shadow:0 2px 8px rgba(25,45,38,.4)"></span>`,
          iconSize: [22, 22],
          iconAnchor: [11, 11]
        });
        const marker = L.marker(place.point, { icon }).addTo(map);
        marker.bindTooltip(place.label, { permanent: true, direction: 'top', offset: [0, -9], className: 'map-label' });
        marker.bindPopup(`<div class="popup-title">${place.title}</div><div class="popup-copy">${place.description}</div>`);
        markers[key] = marker;
      });

      const corridor = [
        [53.64, -113.49],
        [53.57, -113.50],
        [53.50, -113.51],
        [53.43, -113.52],
        [53.36, -113.55],
        [53.30, -113.58]
      ];
      L.polyline(corridor, {
        color: '#ef792f',
        weight: 5,
        opacity: 0.86,
        dashArray: '9 8',
        lineCap: 'round'
      }).addTo(map).bindTooltip('Hwy 2 · Vitaler CANAMEX-Handels- und Transitkorridor', { sticky: true });

      map.setView([53.47, -113.68], 9);

      document.querySelectorAll('[data-place]').forEach((button) => {
        button.addEventListener('click', () => {
          const marker = markers[button.dataset.place];
          map.flyTo(marker.getLatLng(), 11, { duration: 0.7 });
          marker.openPopup();
        });
      });
    </script>
  </body>
</html>
